<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">


<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
NTUT Food｜AI 北科美食推薦
</title>


<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{

    --orange:#ff8c42;

    --orange-light:#fff1e5;

    --yellow:#ffd166;

    --green:#5cb85c;

    --red:#ff6464;

    --dark:#292929;

    --gray:#777;

    --light:#f7f7f7;

    --white:#fff;

    --border:#e8e8e8;

    --shadow:
        0 8px 25px rgba(0,0,0,.08);

}


/* =========================================================
   RESET
========================================================= */

*{

    box-sizing:border-box;

    margin:0;

    padding:0;

}


body{

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    background:var(--light);

    color:var(--dark);

}


button,
input,
select,
textarea{

    font-family:inherit;

}


button{

    cursor:pointer;

}


/* =========================================================
   HEADER
========================================================= */

header{

    position:sticky;

    top:0;

    z-index:100;

    background:white;

    border-bottom:
        1px solid var(--border);

}


.header-inner{

    max-width:1100px;

    margin:auto;

    padding:14px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.logo{

    font-size:23px;

    font-weight:900;

}


.logo span{

    color:var(--orange);

}


.user-pill{

    border:0;

    background:var(--orange-light);

    padding:8px 14px;

    border-radius:20px;

    font-size:13px;

}


/* =========================================================
   MAIN
========================================================= */

main{

    max-width:1100px;

    margin:auto;

    padding:
        25px
        20px
        100px;

}


/* =========================================================
   HERO
========================================================= */

.hero{

    background:
        linear-gradient(
            135deg,
            #fff0dd,
            #fffaf4
        );

    border-radius:28px;

    padding:35px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}


.hero h1{

    font-size:38px;

    margin-bottom:10px;

}


.hero p{

    color:var(--gray);

    line-height:1.8;

    margin-bottom:20px;

}


.hero-cat{

    font-size:90px;

}


/* =========================================================
   BUTTON
========================================================= */

.primary-btn{

    border:0;

    background:var(--orange);

    color:white;

    padding:
        13px
        22px;

    border-radius:14px;

    font-size:15px;

    font-weight:bold;

}


.primary-btn:hover{

    opacity:.9;

}


.secondary-btn{

    border:
        1px solid var(--border);

    background:white;

    padding:
        10px
        16px;

    border-radius:12px;

}


/* =========================================================
   AI
========================================================= */

.ai-section{

    background:white;

    border-radius:24px;

    padding:25px;

    box-shadow:var(--shadow);

    margin-bottom:30px;

}


.ai-title{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:8px;

}


.ai-avatar{

    width:48px;

    height:48px;

    border-radius:50%;

    background:var(--orange-light);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

}


.ai-description{

    color:var(--gray);

    margin-bottom:20px;

}


.chat-box{

    background:#f8f8f8;

    border-radius:18px;

    padding:18px;

    min-height:170px;

    max-height:350px;

    overflow-y:auto;

    margin-bottom:15px;

}


.message{

    display:flex;

    margin-bottom:15px;

}


.message.ai{

    justify-content:flex-start;

}


.message.user{

    justify-content:flex-end;

}


.message-bubble{

    max-width:80%;

    padding:
        12px
        15px;

    border-radius:16px;

    line-height:1.6;

}


.message.ai
.message-bubble{

    background:white;

    border:
        1px solid var(--border);

}


.message.user
.message-bubble{

    background:var(--orange);

    color:white;

}


.chat-input{

    display:flex;

    gap:10px;

}


.chat-input input{

    flex:1;

    padding:14px;

    border:
        1px solid var(--border);

    border-radius:14px;

    outline:none;

    font-size:15px;

}


.chat-input input:focus{

    border-color:var(--orange);

}


.quick-prompts{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-top:12px;

}


.quick-prompt{

    border:
        1px solid #ddd;

    background:white;

    padding:
        8px
        12px;

    border-radius:20px;

    font-size:12px;

}


/* =========================================================
   AI UNDERSTANDING
========================================================= */

.ai-understanding{

    display:none;

    background:#fff8e8;

    border-radius:18px;

    padding:18px;

    margin-top:18px;

}


.ai-understanding.show{

    display:block;

}


.tag-list{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-top:10px;

}


.tag{

    background:white;

    border:
        1px solid #eee;

    padding:
        7px
        11px;

    border-radius:20px;

    font-size:13px;

}


/* =========================================================
   AI RESULTS
========================================================= */

.ai-results{

    display:none;

    margin-top:20px;

}


.ai-results.show{

    display:block;

}


.result-title{

    margin-bottom:15px;

}


.result-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

}


.result-card{

    background:white;

    border:
        1px solid var(--border);

    border-radius:18px;

    overflow:hidden;

}


.result-image{

    height:130px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:60px;

    background:var(--orange-light);

}


.result-body{

    padding:15px;

}


.result-rank{

    font-size:13px;

    color:var(--orange);

    font-weight:bold;

    margin-bottom:5px;

}


.result-body h3{

    margin-bottom:7px;

}


.result-meta{

    color:var(--gray);

    font-size:13px;

    margin-bottom:8px;

}


.ai-reason{

    background:#f8f8f8;

    border-radius:10px;

    padding:10px;

    font-size:13px;

    line-height:1.6;

    margin-top:10px;

}


.result-actions{

    display:flex;

    gap:8px;

    margin-top:12px;

}


.result-actions button{

    flex:1;

}


/* =========================================================
   SEARCH
========================================================= */

.search-area{

    display:flex;

    gap:10px;

    margin-bottom:15px;

}


.search-area input{

    flex:1;

    border:
        1px solid var(--border);

    padding:14px;

    border-radius:14px;

    font-size:15px;

}


.search-area button{

    border:0;

    background:var(--dark);

    color:white;

    padding:
        0
        20px;

    border-radius:14px;

}


/* =========================================================
   FILTER
========================================================= */

.filters{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:10px;

    margin-bottom:25px;

}


.filter-btn{

    border:
        1px solid #ddd;

    background:white;

    padding:
        9px
        15px;

    border-radius:20px;

    white-space:nowrap;

}


.filter-btn.active{

    background:var(--orange);

    color:white;

    border-color:var(--orange);

}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:30px;

}


.stat{

    background:white;

    border-radius:18px;

    padding:18px;

}


.stat-label{

    color:var(--gray);

    font-size:13px;

}


.stat-number{

    font-size:27px;

    font-weight:bold;

    margin-top:5px;

}


/* =========================================================
   SECTION
========================================================= */

.section{

    margin-bottom:35px;

}


.section-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

}


.section-title h2{

    font-size:21px;

}


.section-title button{

    border:0;

    background:none;

    color:var(--orange);

    font-weight:bold;

}


/* =========================================================
   RESTAURANT CARD
========================================================= */

.restaurant-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;

}


.restaurant-card{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 4px 15px rgba(0,0,0,.05);

    transition:.2s;

}


.restaurant-card:hover{

    transform:translateY(-4px);

    box-shadow:var(--shadow);

}


.food-image{

    height:140px;

    background:var(--orange-light);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:60px;

    position:relative;

}


.private-tag{

    position:absolute;

    top:9px;

    left:9px;

    background:#292929;

    color:white;

    padding:
        5px
        9px;

    border-radius:12px;

    font-size:11px;

}


.favorite{

    position:absolute;

    right:9px;

    top:9px;

    width:34px;

    height:34px;

    border:0;

    background:white;

    border-radius:50%;

    font-size:18px;

    z-index:2;

}


.favorite.active{

    color:#ff4d6d;

}


.card-body{

    padding:14px;

}


.card-body h3{

    margin-bottom:7px;

}


.card-meta{

    color:var(--gray);

    font-size:12px;

    margin-bottom:7px;

}


.rating{

    color:#f3a623;

    font-weight:bold;

}


.card-bottom{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:10px;

}


.detail-btn{

    border:0;

    background:#f1f1f1;

    padding:
        7px
        10px;

    border-radius:9px;

}


/* =========================================================
   RECOMMEND BOX
========================================================= */

.recommend-box{

    background:white;

    border-radius:22px;

    padding:30px;

    text-align:center;

    box-shadow:var(--shadow);

}


.recommend-box p{

    color:var(--gray);

    margin:
        10px
        0
        20px;

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.5);

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:500;

}


.modal.show{

    display:flex;

}


.modal-content{

    width:min(600px,100%);

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:22px;

    padding:25px;

    animation:
        modalIn .2s ease;

}


@keyframes modalIn{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.close{

    border:0;

    background:#eee;

    width:35px;

    height:35px;

    border-radius:50%;

}


.close:hover{

    background:#ddd;

}


/* =========================================================
   FORM
========================================================= */

.form-group{

    margin-bottom:15px;

}


.form-group label{

    display:block;

    font-weight:bold;

    margin-bottom:6px;

}


.form-group input,
.form-group select,
.form-group textarea{

    width:100%;

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:12px;

    outline:none;

}


.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

    border-color:var(--orange);

}


.form-group textarea{

    min-height:100px;

}


/* =========================================================
   FAVORITE LIST
========================================================= */

.favorite-empty{

    text-align:center;

    padding:35px 10px;

    color:#999;

}


.favorite-item{

    display:flex;

    align-items:center;

    gap:12px;

    padding:13px 0;

    border-bottom:
        1px solid #eee;

}


.favorite-item:last-child{

    border-bottom:0;

}


.favorite-icon{

    width:55px;

    height:55px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--orange-light);

    border-radius:14px;

    font-size:28px;

}


.favorite-info{

    flex:1;

}


.favorite-info h3{

    font-size:16px;

    margin-bottom:4px;

}


.favorite-info p{

    color:var(--gray);

    font-size:12px;

    line-height:1.6;

}


.favorite-open{

    border:0;

    background:#f1f1f1;

    padding:
        8px
        11px;

    border-radius:9px;

    white-space:nowrap;

}


.favorite-remove{

    border:0;

    background:white;

    font-size:18px;

    color:#ff4d6d;

}


/* =========================================================
   DETAIL
========================================================= */

.detail-hero{

    font-size:90px;

    text-align:center;

    background:var(--orange-light);

    border-radius:18px;

    padding:25px;

    margin-bottom:18px;

}


.detail-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.detail-title h2{

    font-size:25px;

}


.detail-favorite{

    border:0;

    background:var(--orange-light);

    width:42px;

    height:42px;

    border-radius:50%;

    font-size:21px;

}


.detail-info{

    color:var(--gray);

    margin:
        8px
        0
        15px;

    line-height:1.8;

}


.detail-box{

    background:#f8f8f8;

    border-radius:14px;

    padding:14px;

    margin-top:12px;

    line-height:1.7;

}


.comment{

    border-top:
        1px solid #eee;

    padding:13px 0;

}


.comment:first-child{

    border-top:0;

}


.comment-user{

    font-weight:bold;

}


.comment-text{

    color:#777;

    margin-top:5px;

    line-height:1.6;

}


/* =========================================================
   MY PAGE
========================================================= */

.my-page-modal{

    width:min(700px,100%);

}


.profile-card{

    display:flex;

    align-items:center;

    gap:18px;

    background:
        linear-gradient(
            135deg,
            #fff0dd,
            #fffaf4
        );

    border-radius:20px;

    padding:22px;

    margin-bottom:16px;

}


.profile-avatar{

    width:72px;

    height:72px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:white;

    font-size:42px;

}


.profile-info{

    flex:1;

}


.profile-info h2{

    margin-bottom:4px;

}


.profile-info p{

    color:var(--gray);

    font-size:13px;

    margin-bottom:10px;

}


.profile-stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:20px;

}


.profile-stats div{

    background:#f8f8f8;

    border-radius:15px;

    padding:
        15px
        10px;

    text-align:center;

}


.profile-stats strong{

    display:block;

    font-size:24px;

}


.profile-stats span{

    color:var(--gray);

    font-size:12px;

}


.my-section{

    margin-top:20px;

}


.my-section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;

}


.my-section-title span{

    color:var(--gray);

    font-size:12px;

}


.history-item{

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px 0;

    border-bottom:
        1px solid #eee;

}


.history-item:last-child{

    border-bottom:0;

}


.history-icon{

    width:52px;

    height:52px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--orange-light);

    border-radius:13px;

    font-size:27px;

}


.history-main{

    flex:1;

    min-width:0;

}


.history-main h4{

    margin-bottom:4px;

}


.history-main p{

    color:var(--gray);

    font-size:12px;

    margin-bottom:4px;

    line-height:1.5;

}


.history-main small{

    color:#999;

    font-size:11px;

}


.empty-history{

    text-align:center;

    color:#999;

    padding:25px 10px;

    line-height:1.8;

}


.account-actions{

    display:flex;

    gap:10px;

    margin-top:25px;

    padding-top:18px;

    border-top:
        1px solid #eee;

}


.account-actions button{

    flex:1;

}


.danger-btn{

    color:#d9534f;

    border-color:#d9534f;

}

.check-btn{
    color: #5cb85c;

    border-color: #5cb85c;
}

.edit-btn{
    color: #f3a623;

    border-color: #f3a623;
}

.warning{
    color: #d9534f;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:65px;

    background:white;

    border-top:
        1px solid var(--border);

    display:flex;

    justify-content:center;

    gap:70px;

    align-items:center;

    z-index:200;

}


.bottom-nav button{

    border:0;

    background:none;

    color:#777;

    font-size:12px;

}


.bottom-nav button.active{

    color:var(--orange);

    font-weight:bold;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    bottom:85px;

    left:50%;

    transform:
        translateX(-50%);

    background:#222;

    color:white;

    padding:
        12px
        20px;

    border-radius:20px;

    opacity:0;

    pointer-events:none;

    transition:.3s;

    z-index:1000;

}


.toast.show{

    opacity:1;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .hero h1{

        font-size:28px;

    }


    .hero-cat{

        font-size:60px;

    }


    .restaurant-grid{

        grid-template-columns:
            repeat(2,1fr);

    }


    .result-grid{

        grid-template-columns:1fr;

    }


    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:550px){

    main{

        padding:
            15px
            12px
            90px;

    }


    .hero{

        padding:23px;

    }


    .hero-cat{

        font-size:45px;

    }


    .hero h1{

        font-size:24px;

    }


    .restaurant-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;

    }


    .food-image{

        height:105px;

        font-size:48px;

    }


    .card-body{

        padding:10px;

    }


    .bottom-nav{

        justify-content:space-around;

        gap:0;

    }


    .profile-card{

        padding:16px;

    }


    .profile-avatar{

        width:60px;

        height:60px;

        font-size:34px;

    }


    .history-item{

        align-items:flex-start;

    }


    .account-actions{

        flex-direction:column;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="header-inner">

<div class="logo">

🍚 <span>NTUT</span> Food

</div>


<button
    class="user-pill"
    id="headerUser"
    onclick="showMyPage()"
>

👋 北科吃貨

</button>

</div>

</header>



<main>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

<div>

<h1>

今天吃什麼？🍜

</h1>


<p>

北科大學生的 AI 美食助手。<br>

直接告訴我你想吃什麼，我幫你選。

</p>


<button
    class="primary-btn"
    onclick="focusAI()"
>

🤖 問問小幫手

</button>

</div>


<div class="hero-cat">

🐱

</div>

</section>



<!-- =====================================================
     AI
===================================================== -->

<section
    class="ai-section"
    id="aiSection"
>

<div class="ai-title">

<div class="ai-avatar">

🐱

</div>


<div>

<h2>

北科吃貨喵

</h2>

</div>

</div>


<p class="ai-description">

不用填一堆選項，直接跟我說你今天想吃什麼。

</p>


<div
    class="chat-box"
    id="chatBox"
>

<div class="message ai">

<div class="message-bubble">

嗨！我是北科吃貨 🐱<br>

告訴我你的預算、口味、距離或今天的心情吧！<br><br>

例如：<br>

「我今天只有 120 元，不想走太遠，想吃辣的。」

</div>

</div>

</div>


<div class="chat-input">

<input
    id="aiInput"
    type="text"
    placeholder="例如：我只有100元，想吃麵，不想走超過5分鐘..."
    onkeydown="

function loadJSON(key, fallback){

        }

        const parsed =
            JSON.parse(value);

        return parsed ?? fallback;

    }catch(error){

        console.warn(
            "讀取 " + key + " 失敗，使用預設資料。",
            error
        );

        return fallback;

    }

}

    const input =
        document.getElementById(

        );

    const text =
        input.value.trim();

    if(!text) return;


    addMessage(
        "user",

    setTimeout(()=>{

        const parsed =
            parseUserRequest(

function addMessage(
    type,
    text
){

    const box =
        document.getElementById(
            "chatBox"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =

    div.innerHTML = `

            ${text}

        </div>

    `;


    box.appendChild(
        div
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =========================================================
   AI PARSING
========================================================= */

function parseUserRequest(
    text
){

    const request={

        budget:null,

        distance:null,

        category:null,

        spicy:false,

        cheap:false,

        good:false,

        quick:false,

        mood:null

    };


    const budgetMatch =
        text.match(
            /(\d+)\s*(元|塊|塊錢)/
        );


    if(budgetMatch){

        request.budget =
            Number(
                budgetMatch[1]
            );

    }


    if(
        text.includes("沒錢") ||
        text.includes("月底") ||
        text.includes("便宜")
    ){

        request.budget =
            request.budget ||
            100;

        request.cheap=true;

    }


    const distanceMatch =
        text.match(
            /(\d+)\s*(分鐘|分|分鐘內)/
        );


    if(distanceMatch){

        request.distance =
            Number(
                distanceMatch[1]
            );

    }


    if(
        text.includes("不想走") ||
        text.includes("附近")
    ){

        request.distance =
            request.distance ||
            5;

    }


    if(
        text.includes("麵")
    ){

        request.category="麵食";

    }

    else if(
        text.includes("飯") ||
        text.includes("便當")
    ){

        request.category="台式";

    }

    else if(
        text.includes("漢堡")
    ){

        request.category="西式";

    }

    else if(
        text.includes("日式") ||
        text.includes("壽司") ||
        text.includes("丼")
    ){

        request.category="日式";

    }

    else if(
        text.includes("水餃") ||
        text.includes("小吃")
    ){

        request.category="小吃";

    }

    else if(
        text.includes("甜") ||
        text.includes("蛋糕")
    ){

        request.category="甜點";

    }

    else if(
        text.includes("咖啡")
    ){

        request.category="咖啡";

    }


    if(
        text.includes("辣")
    ){

        request.spicy=true;

    }


    if(
        text.includes("累") ||
        text.includes("疲")
    ){

        request.mood="累";

    }


    if(
        text.includes("趕") ||
        text.includes("時間")
    ){

        request.quick=true;

    }


    if(
        text.includes("好一點") ||
        text.includes("犒賞")
    ){

        request.good=true;

    }


    return request;

}


/* =========================================================

========================================================= */

function generateAIResponse(
    r
){

    let parts=[];


    if(r.budget){

        parts.push(
            `預算抓在 $${r.budget} 以下`
        );

    }


    if(r.distance){

        parts.push(
            `距離控制在 ${r.distance} 分鐘內`
        );

    }


    if(r.category){

        parts.push(
            `想吃 ${r.category}`
        );

    }


    if(r.spicy){

        parts.push(
            "想吃辣"
        );

    }


    if(parts.length===0){

        return `

            🐱 收到！<br><br>

            我會綜合價格、距離、
            評分和學生推薦度幫你挑選。<br><br>

            看看下面這幾間 👇

        `;

    }


    return `

        🐱 收到！<br><br>

        我理解你的需求是：<br><br>

        <strong>
            ${parts.join("、")}
        </strong>

        <br><br>

        我會綜合價格、距離、
        評價和學生推薦度幫你選。<br><br>

        看看下面這幾間 👇

    `;

}


/* =========================================================

========================================================= */

function showUnderstanding(
    r
){

    const box =
        document.getElementById(
            "aiUnderstanding"
        );


    const tags =
        document.getElementById(
            "understandingTags"
        );


    let html="";


    if(r.budget){

        html += `

            <span class="tag">

                💰 $${r.budget} 以下

            </span>

        `;

    }


    if(r.distance){

        html += `

            <span class="tag">

                🚶 ${r.distance} 分鐘內

            </span>

        `;

    }


    if(r.category){

        html += `

            <span class="tag">

                🍴 ${r.category}

            </span>

        `;

    }


    if(r.spicy){

        html += `

            <span class="tag">

                🌶️ 辣

            </span>

        `;

    }


    if(!html){

        html=`

            <span class="tag">

                🤖 綜合推薦

            </span>

        `;

    }


    tags.innerHTML=html;

    box.classList.add(
        "show"
    );

}


/* =========================================================
   AI RESULTS
========================================================= */

function showAIResults(
    request
){

    let candidates =
        restaurants.filter(
            r=>{

                if(
                    request.budget &&
                    r.price >
                    request.budget
                ){

                    return false;

                }


                if(
                    request.distance &&
                    r.distance >
                    request.distance
                ){

                    return false;

                }


                if(
                    request.category &&
                    r.category !==
                    request.category
                ){

                    return false;

                }


                if(
                    request.spicy &&
                    !r.spicy
                ){

                    return false;

                }


                return true;

            }
        );


    if(
        candidates.length===0
    ){

        candidates =
            restaurants.filter(
                r=>{

                    if(
                        request.budget &&
                        r.price >
                        request.budget+50
                    ){

                        return false;

                    }


                    if(
                        request.distance &&
                        r.distance >
                        request.distance+5
                    ){

                        return false;

                    }


                    return true;

                }
            );

    }


    candidates =
        candidates.map(
            r=>{

                let score=0;


                score +=
                    r.rating*20;


                score +=
                    Math.min(
                        r.recommendations/5,
                        20
                    );


                score +=
                    Math.max(
                        15-r.distance,
                        0
                    );


                if(r.private){

                    score+=10;

                }


                if(
                    request.spicy &&
                    r.spicy
                ){

                    score+=15;

                }


                if(
                    request.cheap &&
                    r.price<=100
                ){

                    score+=15;

                }


                return{

                    ...r,

                    aiScore:score

                };

            }
        );


    candidates.sort(
        (a,b)=>
            b.aiScore -
            a.aiScore
    );


    const top3 =
        candidates.slice(
            0,
            3
        );


    const grid =
        document.getElementById(
            "aiResultGrid"
        );


    grid.innerHTML =
        top3
            .map(
                (r,index)=>
                    createAIResultCard(
                        r,
                        index,
                        request
                    )
            )
            .join("");


    document
        .getElementById(
            "aiResults"
        )
        .classList.add(
            "show"
        );

}

    if(
        request.distance &&

        );

    }


    if(r.rating>=4.7){

        );

    }


    if(r.private){

        reason.push(
            "北科學生私藏"
        );

    }


    if(
        request.spicy &&
        r.spicy
    ){

    }


    if(reason.length===0){

   RENDER
========================================================= */

function renderRestaurants(){

    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const keyword =
        searchInput
        .value
        .toLowerCase();


    let filtered =
        restaurants.filter(
            r=>{

                if(
                    currentCategory !==
                    "全部" &&
                    r.category !==
                    currentCategory
                ){

                    return false;

                }


                if(keyword){

                    const text=`

                        ${r.name}
                        ${r.category}
                        ${r.dish}
                        ${r.reason}

                    `.toLowerCase();


                    if(
                        !text.includes(
                            keyword
                        )
                    ){

                        return false;

                    }

                }


                return true;

            }
        );


    if(currentSort === "rating"){

        filtered.sort(
            (a,b)=>{

                const ratingA = Number(a.rating) || 0;
                const ratingB = Number(b.rating) || 0;

                if(ratingB !== ratingA){
                    return ratingB - ratingA;
                }

                return (Number(b.recommendations) || 0) -
                    (Number(a.recommendations) || 0);

            }
        );

    }else{

        filtered.sort(
            (a,b)=>
                (Number(b.recommendations) || 0) -
                (Number(a.recommendations) || 0)
        );

    }


    document
        .getElementById(
            "restaurantGrid"
        )
        .innerHTML =
        filtered
            .map(
                createRestaurantCard
            )
            .join("");


    document
        .getElementById(
            "privateGrid"
        )
        .innerHTML =
        restaurants
            .filter(
                r=>r.private
            )
            .slice(0,4)
            .map(
                createRestaurantCard
            )
            .join("");

}

function addComment(
    id
){

    const input =
        document.getElementById(
            "commentInput"
        );


    const text =
        input.value.trim();


    if(!text){

        showToast(
            "請先輸入評論"
        );

        return;

    }


    const r =
        restaurants.find(
            x=>x.id===id
        );


    if(!r) return;


    if(!r.comments){

        r.comments=[];

    }


    r.comments.push({

        userId:
            currentUser.id,

        user:
            currentUser.name,

        text:text,

        createdAt:
            new Date()
                .toISOString()

    });


    r.recommendations++;


    saveData();

    renderRestaurants();

    updateStats();

    openDetail(id);


    showToast(
        "評論已發布 💬"
    );

}

function submitRecommendation(

){

    event.preventDefault();

            )
            .value;


    const restaurant={

        id:
            Date.now(),

        name:
            document
                .getElementById(

                )
                .value
                .trim(),

        category:

            category,

        price:

            Number(
                document
                    .getElementById(
                        "newPrice"
                    )
                    .value
            ) || 120,

        distance:

            Number(
                document
                    .getElementById(
                        "newDistance"
                    )
                    .value
            ) || 5,

        rating:

            Number(
                document
                    .getElementById(
                        "newRating"
                    )
                    .value
            ),

        emoji:

            getEmoji(
                category
            ),

        private:

            document
                .getElementById(
                    "newPrivate"
                )
                .value ===
                "yes",

        recommendations:1,

        dish:

            document
                .getElementById(

                .value
            ||
            "招牌餐點",

        reason:

                .getElementById(
                    "newReason"
                )
                .value,

        spicy:

            document
                .getElementById(
                    "newReason"
                )
                .value
                .includes("辣"),

        comments:[]

    };


    restaurants.unshift(
        restaurant
    );


    /* 建立自己的推薦紀錄 */

    myRecommendations.unshift({

        restaurantId:
            restaurant.id,

        name:
            restaurant.name,

        category:
            restaurant.category,

        price:
            restaurant.price,

        rating:
            restaurant.rating,

        emoji:
            restaurant.emoji,

        dish:
            restaurant.dish,

        reason:
            restaurant.reason,

                .toISOString()

    });


    saveUserData();

    saveData();


    renderRestaurants();

    updateStats();


    closeModal(
        "recommendModal"

    event.target.reset();


    showToast(

                        id=>
                            restaurants.find(
                                r=>r.id===id

                    .filter(Boolean)
                    .slice(0,5)
                    .map(
                        r=>`

                            <div

                                            r.name
                                        )}

                                    <p>

                                        ${r.category}

                                        ·

                                        $${r.price}

                                        ·

                                        🚶
                                        ${r.distance}
                                        分鐘

                                    </p>

                                </div>


                                <button
                                    class="detail-btn"
                                    onclick="
                                        openDetail(
                                            ${r.id}
                                        );
                                        closeModal(
                                            'myPageModal'
                                        );
                                    "
                                >

                                    查看

                                </button>

                            </div>

                        `
                    )
                    .join("")

                :

                `

                <div class="empty-history">

                    ❤️

                    <br>

                    <strong>

                        還沒有收藏

                    </strong>

                    <br>

                    <span>

                        看到喜歡的餐廳

        </div>


        <div class="account-actions">

            <button
                class="secondary-btn

                "
                onclick="
                    editUserName()
                "

            </button>


            <button
                class="secondary-btn
                        check-btn
                "
                onclick="
                    confirmUserData()
                "
            >

                確認資料

            </button>


            <button
                class="
                    secondary-btn
                    danger-btn
                "
                onclick="
                    resetUserData()
                "
            >

                清除個人資料

            </button>

        </div>

    `;

}


/* =========================================================
   EDIT USER NAME
========================================================= */

function editUserName(){

    const name =
        prompt(
            "請輸入新的帳號名稱：",
            currentUser.name
        );


    if(name===null) return;


    const trimmed =
        name.trim();


    if(!trimmed){

        showToast(
            "名稱不能是空白"
        );

        return;

    }


    currentUser.name =
        trimmed.slice(
            0,
            20
        );


    saveUserData();


    const headerUser =
        document.getElementById(
            "headerUser"
        );


    if(headerUser){

        headerUser.textContent =
            "👋 " +
            currentUser.name;

    }


    renderMyPage();


    showToast(
        "帳號名稱已更新！"
    );

}


/* =========================================================
   RESET USER
========================================================= */

function confirmUserData(){

    saveUserData();

    showToast(
        "個人資料已確認 ✓"
    );

}


function resetUserData(){

    const confirmed =
        confirm(
            "確定要清除所有個人資料嗎？\\n\\n" +
            "將會清除：\\n" +
            "• 帳號名稱\\n" +
            "• 我的推薦紀錄\\n" +
            "• 我的收藏\\n" +
            "• 我發布的評論\\n\\n" +
            "餐廳公共資料不會被刪除。"
        );


    if(!confirmed) return;


    const oldUserId =
        currentUser.id;

    const oldUserName =
        currentUser.name;


    restaurants.forEach(
        r=>{

            if(
                !Array.isArray(
                    r.comments
                )
            ){

                return;

            }


            r.comments =
                r.comments.filter(
                    comment=>{

                        if(
                            comment &&
                            comment.userId
                        ){

                            return (
                                comment.userId !==
                                oldUserId
                            );

                        }


                        return !(
                            comment &&
                            comment.user ===
                            oldUserName
                        );

                    }
                );

        }
    );


    currentUser = {

        id:
            "user_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2,8),

        name:"北科吃貨",

        avatar:"🐱"

    };


    myRecommendations = [];

    favorites = [];


    saveUserData();

    saveData();


    const headerUser =
        document.getElementById(
            "headerUser"
        );


    if(headerUser){

        headerUser.textContent =
            "👋 北科吃貨";

    }


    renderRestaurants();

    updateStats();

    renderMyPage();


    showToast(
        "個人資料與評論已全部清除"
    );

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    date
){

    if(!date){

        return "日期未記錄";

    }


    const d =
        new Date(date);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "日期未記錄";

    }


    return d.toLocaleDateString(
        "zh-TW",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    );

}

/* =========================================================
   MODAL
========================================================= */

function closeModal(
    id
){

    document
        .getElementById(
            id
        )
        .classList.remove(
            "show"
        );

}


/* =========================================================
   CLICK OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    event=>{

        if(
            event.target.classList.contains(
                "modal"
            )
        ){

            event.target.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            document
                .querySelectorAll(
                    ".modal"
                )
                .forEach(
                    modal=>
                        modal.classList.remove(
                            "show"
                        )
                );

        }

    }
);


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(()=>{

        toast.classList.remove(
            "show"
        );

    },1800);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    text
){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
